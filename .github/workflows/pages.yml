name: Build and deploy ORBIT
on:
  push:
    branches: [main, codex/mobile-explorer]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements-web-assets.txt
      - uses: actions/cache@v4
        with:
          path: .cache/web-assets
          key: orbit-images-${{ hashFiles('scripts/web_assets.json') }}
      - run: npm ci
      - run: python -m pip install -r scripts/requirements-web-assets.txt
      - run: python scripts/prepare_web_assets.py
      - run: npm test
      - run: npm run build
      - run: npm run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
